name: Build Windows Store MSIX Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows-msix:
    name: Build & Package Windows Store (MSIX)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate 8 Languages
        run: python scripts/validate_languages.py

      - name: Build Desktop Distributable
        run: ./gradlew.bat :desktop:createDistributable --no-daemon

      - name: Run Windows Store Packaging Script
        run: python scripts/package_windows_store.py

      - name: Locate Windows SDK & Sign MSIX (Self-Signed Test Certificate)
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=InfoReis" -KeyUsage DigitalSignature -FriendlyName "VitalPet Dev Certificate" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $certPath = "desktop\build\windows-store\VitalPet-TestCert.cer"
          Export-Certificate -Cert $cert -FilePath $certPath

          $pfxPath = "desktop\build\windows-store\VitalPet-TestCert.pfx"
          $pwd = ConvertTo-SecureString -String "VitalPet2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd

          # Locate SignTool.exe in Windows SDK
          $signTool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
          if ($signTool) {
              Write-Host "Using SignTool at: $signTool"
              & $signTool sign /fd SHA256 /a /f $pfxPath /p "VitalPet2026" "desktop\build\windows-store\VitalPet.msix"
              Write-Host "MSIX package signed successfully."
          } else {
              Write-Warning "SignTool.exe not found in Windows SDK."
          }

      - name: Upload Windows Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VitalPet-Windows-Store-MSIX
          path: |
            desktop/build/windows-store/VitalPet.msix
            desktop/build/windows-store/VitalPet.appx
            desktop/build/windows-store/VitalPet-TestCert.cer
            desktop/build/windows-store/Install-VitalPet-Test.ps1
